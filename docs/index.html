    <script>
      (function() {
        // 1. One-click and automated cache-clearing recovery function
        window.__wealthtrack_clearcache_and_reload = function() {
          var reloadNow = function() {
            var url = new URL(window.location.href);
            url.searchParams.set('reload', Date.now().toString());
            window.location.replace(url.toString());
          };

          var promises = [];
          if ('serviceWorker' in navigator) {
            promises.push(
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              }).catch(function() {})
            );
          }
          if ('caches' in window) {
            promises.push(
              caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).catch(function() {})
            );
          }
          try {
            sessionStorage.clear();
          } catch(e) {}

          Promise.all(promises).then(reloadNow).catch(reloadNow);
          setTimeout(reloadNow, 800);
        };

        // 2. Catch script load errors & stale chunk errors (e.g., 404 on obsolete hashed bundle)
        window.addEventListener('error', function(event) {
          if (event && event.target && event.target.tagName === 'SCRIPT') {
            console.warn('[WealthTrack] Failed to load bundle asset:', event.target.src);
            var recoveryBox = document.getElementById('wealthtrack-fallback-recovery');
            if (recoveryBox) recoveryBox.style.display = 'block';
          }
          var msg = event.message ? String(event.message) : '';
          if (msg.includes('Failed to fetch dynamically imported module') || msg.includes('Unexpected token') || msg.includes('Loading chunk')) {
            console.warn('[WealthTrack] Detected stale chunk error, initiating recovery...');
            var recoveryBox = document.getElementById('wealthtrack-fallback-recovery');
            if (recoveryBox) recoveryBox.style.display = 'block';
          }
        }, true);

        // 3. Fallback recovery timer: reveal button if app doesn't mount within 3.5s
        setTimeout(function() {
          var root = document.getElementById('root');
          var loader = document.getElementById('wealthtrack-initial-loader');
          var recoveryBox = document.getElementById('wealthtrack-fallback-recovery');
          if (loader && root && root.contains(loader) && recoveryBox) {
            recoveryBox.style.display = 'block';
          }
        }, 3500);

        // 4. Suppress Vite HMR WebSocket errors in AI Studio iframe environment
        if (typeof window !== 'undefined') {
          var _origErr = console.error;
          console.error = function() {
            var msg = arguments[0] ? String(arguments[0]) : '';
            if (msg.includes('WebSocket') || msg.includes('[vite]') || msg.includes('vite-hmr')) {
              return;
            }
            _origErr.apply(console, arguments);
          };

          if (window.WebSocket) {
            var RealWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              var isVite = (typeof url === 'string' && (url.includes('vite') || url.includes('/@vite/client'))) ||
                           protocols === 'vite-hmr' ||
                           (Array.isArray(protocols) && protocols.includes('vite-hmr'));
              if (isVite) {
                var dummy = new EventTarget();
                dummy.readyState = 1;
                dummy.bufferedAmount = 0;
                dummy.extensions = '';
                dummy.protocol = 'vite-hmr';
                dummy.binaryType = 'blob';
                dummy.url = url;
                dummy.send = function() {};
                dummy.close = function() {};
                dummy.onopen = null;
                dummy.onclose = null;
                dummy.onerror = null;
                dummy.onmessage = null;
                setTimeout(function() {
                  if (typeof dummy.onopen === 'function') dummy.onopen({ type: 'open' });
                  dummy.dispatchEvent(new Event('open'));
                }, 10);
                return dummy;
              }
              return new RealWebSocket(url, protocols);
            };
            window.WebSocket.prototype = RealWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          window.addEventListener('error', function(event) {
            if (event && (
              (event.message && (event.message.includes('WebSocket') || event.message.includes('[vite]'))) ||
              (event.filename && event.filename.includes('@vite/client'))
            )) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reasonStr = event.reason ? (event.reason.message || String(event.reason)) : '';
            if (reasonStr.includes('WebSocket') || reasonStr.includes('[vite]')) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);
        }

        // 5. Ensure trailing slash for GitHub Pages repo subdirectories so relative ./assets resolve correctly
        if (window.location.pathname.slice(-1) !== '/' && !window.location.pathname.split('/').pop().includes('.')) {
          window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>

          <div id="wealthtrack-fallback-recovery" style="display: none; background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; margin-top: 20px; text-align: center;">

            <button onclick="window.__wealthtrack_clearcache_and_reload()" style="background: #10b981; color: #08090c; border: none; padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; transition: opacity 0.15s;">
              ⚡ Clear Cache & Force Refresh

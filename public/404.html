<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WealthTrack Pro - Expense & Portfolio Manager</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Only redirect for actual page navigations, NOT for missing assets like .js, .css, .png, etc.
      var path = window.location.pathname;
      var isAsset = /\.(js|css|json|png|jpg|jpeg|svg|ico|woff|woff2|map)$/i.test(path);
      if (!isAsset) {
        sessionStorage.redirect = location.href;
        window.location.replace('./');
      }
    </script>
    <meta http-equiv="refresh" content="0;URL='./'">
  </head>
  <body style="background-color: #08090c; color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to WealthTrack Pro...</p>
  </body>
</html>
